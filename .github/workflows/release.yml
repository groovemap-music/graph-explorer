name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@5e52f14885e70f39c7f588d89fc2a1316d4c4b13
    with:
      repository-name: graph-explorer
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
        dist/provenance.json
      publish-image: true
      prepare-image-command: just prepare-runtime-wheel
